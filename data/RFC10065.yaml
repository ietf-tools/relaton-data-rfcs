abstract:
- content: "<p>This document defines a YANG data model for policy-based network access
    control, which enables enforcement of network access control policies based on
    group identity. This YANG data model extends Access Control Lists (ACLs) with
    date and time parameters to support schedule-aware policy enforcement.</p><p>Specifically
    in scenarios where network access is triggered by user authentication, this document
    defines a mechanism that eases the maintenance of the mapping between a user group
    identifier and a set of packet header fields to enforce policy-based network access
    control. Moreover, this document defines a Remote Authentication Dial-in User
    Service (RADIUS) attribute that is used to communicate the user group identifier
    as part of identification and authorization information.</p>"
