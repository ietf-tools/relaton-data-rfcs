abstract:
- content: "<p>This document specifies a framework that enables enterprise telephony\r\n
    Session Initiation Protocol (SIP) networks to solicit and obtain a\r\n capability
    set document from a SIP service provider. The capability\r\n set document encodes
    a set of characteristics that enable easy\r\n peering between enterprise and service
    provider SIP networks.</p>"
