abstract:
- content: "<p>This document defines the security protocol Group Object Security for
    Constrained RESTful Environments (Group OSCORE), providing end-to-end security
    of messages exchanged with the Constrained Application Protocol (CoAP) between
    members of a group, e.g., sent over IP multicast. In particular, Group OSCORE
    provides protection and source authentication for group requests sent from a client
    to multiple servers and for the corresponding responses. Group OSCORE also defines
    a pairwise mode where each member of the group can efficiently derive symmetric
    pairwise keys to use with another member of the group for pairwise-protected communication.
    Group OSCORE can be used between endpoints communicating with CoAP or CoAP-mappable
    HTTP.</p>"
