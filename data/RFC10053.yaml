abstract:
- content: "<p>This document describes a framework for Computing-Aware Traffic\r\n
    Steering (CATS). Specifically, the document identifies a set of CATS\r\n functional
    components, describes their interactions, and provides\r\n illustrative workflows
    of the control and data planes. The framework\r\n covers only the case of a single
    service provider.</p>"
