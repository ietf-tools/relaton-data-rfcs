abstract:
- content: "<p>This document describes the AEGIS-128L, AEGIS-256, AEGIS-128X, and
    AEGIS-256X AES-based authenticated encryption with associated data (AEAD) algorithms
    designed for high-performance applications. It also specifies their use as stream
    ciphers and message authentication codes (MACs).</p><p>The document is a product
    of the Crypto Forum Research Group (CFRG).</p>"
