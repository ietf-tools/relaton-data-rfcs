abstract:
- content: <p>"YANG Library" (RFC 8525) specifies the "ietf-yang-library" YANG module
    that provides information about the YANG modules, datastores, and datastore schemas
    used by a network management server.</p><p>This document augments the "ietf-yang-library"
    module to provide the augmented-by list. It facilitates the process of obtaining
    all dependencies between YANG modules by querying the network management server's
    YANG library. This document updates RFC 8525 to also include the augmented-by
    list.</p>
