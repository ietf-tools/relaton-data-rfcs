abstract:
- content: "<p>The Composite Module-Lattice-Based Digital Signature Algorithm (ML-DSA)
    defines combinations of ML-DSA with RSA, ECDSA, and EdDSA. This document specifies
    the conventions for using Composite ML-DSA algorithms within the Cryptographic
    Message Syntax (CMS).</p>"
