abstract:
- content: "<p>This document defines an operational convention that uses the\r\n reserved
    underscored DNS leaf node name \"_for-sale\" to indicate the\r\n parent domain
    name is available for purchase.\r\n\r\n The convention can be deployed without
    disrupting existing\r\n operations, and it may be applied even when the domain
    name is still\r\n actively in use.</p>"
