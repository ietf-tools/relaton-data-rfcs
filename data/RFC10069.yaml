abstract:
- content: "<p>This document specifies a multipath extension for the QUIC protocol\r\n
    to enable the simultaneous usage of multiple paths for a single\r\n connection.
    It introduces explicit path identifiers to create,\r\n delete, and manage multiple
    paths. This document does not specify\r\n address discovery or management, nor
    how applications using QUIC\r\n schedule traffic over multiple paths.</p>"
