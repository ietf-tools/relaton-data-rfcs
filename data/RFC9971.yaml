abstract:
- content: <p>This document describes an alternative to throughput in "Benchmarking
    Methodology for Network Interconnect Devices" (RFC 2544) by defining a new methodology
    called Multiple Loss Ratio Search (MLRsearch). MLRsearch aims to minimize Search
    Duration, support multiple loss ratio goals, and improve result repeatability
    and comparability.</p><p>MLRsearch is motivated by the pressing need to address
    the challenges of evaluating and testing the various data plane solutions, especially
    in software-based networking systems based on Commercial Off-the-Shelf (COTS)
    CPU hardware vs. purpose-built Application-Specific Integrated Circuit (ASIC)
    / Network Processing Unit (NPU) / Field-Programmable Gate Array (FPGA) hardware.</p>
