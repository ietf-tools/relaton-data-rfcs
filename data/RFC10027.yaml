abstract:
- content: "<p>This document describes threats against cross-device flows along with
    practical mitigations, protocol selection guidance, and a summary of formal analysis
    results identified as relevant to the security of cross-device flows. It serves
    as a security guide to system designers, architects, product managers, security
    specialists, fraud analysts, and engineers implementing cross-device flows.</p>"
