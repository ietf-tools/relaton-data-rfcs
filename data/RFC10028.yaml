abstract:
- content: '<p>This document describes limitations of the existing range of dynamic
    IPv6 multicast addresses specified in "Allocation Guidelines for IPv6 Multicast
    Addresses" (RFC 3307). It updates RFC 3307 by replacing these allocations with
    a new IANA registry in the "IPv6 Multicast Address Space" registry group. The
    document also defines initial contents of the new registry: a reduced allocation
    for the Multicast Address Dynamic Client Allocation Protocol (MADCAP) (RFC 2730),
    a range for Source-Specific Multicast (SSM), a Private Use range, a range for
    Experimental Use, and Solicited-Node multicast addresses (which were not previously
    noted in RFC 3307).</p>'
