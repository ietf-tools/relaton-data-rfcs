abstract:
- content: <p>The "VTODO" calendar component in the Internet Calendaring and Scheduling
    Core Object Specification (iCalendar; RFC 5545) has seen limited adoption and
    use, mainly for personal reminders and to-do lists.</p><p>This document updates
    RFC 5545 and defines extensions to "VTODO" to provide improved status tracking,
    scheduling, and specification of tasks to allow its use in other contexts, such
    as process control and project management.</p><p>It also defines how Calendaring
    Extensions to WebDAV (CalDAV) (RFC 4791) servers can be extended to support certain
    automated task management behaviors.</p>
